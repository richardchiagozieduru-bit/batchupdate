{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful &mdash; FirstCentral Data Cleaner</title>
    <style>
        :root {
            --blue:       #1b3f8f;
            --blue-light: #2b56b8;
            --orange:     #f47920;
            --text:       #1e293b;
            --text-muted: #64748b;
            --border:     #e2e8f0;
            --bg:         #f4f7fb;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); padding: 2rem 1rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%; max-width: 440px;
            box-shadow: 0 4px 24px rgba(27,63,143,0.10);
            border: 1px solid var(--border);
            text-align: center;
        }
        .card-logo { margin-bottom: 1.75rem; }
        .card-logo img { width: 160px; height: auto; }
        .success-icon {
            width: 68px; height: 68px;
            background: #f0fdf4; border: 1.5px solid #bbf7d0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .success-icon svg { width: 32px; height: 32px; color: #16a34a; }
        .card-heading {
            font-size: 1.45rem; font-weight: 700;
            color: var(--text); margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .card-sub {
            font-size: 0.9rem; color: var(--text-muted);
            line-height: 1.6; margin-bottom: 2rem;
        }
        .orange-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--orange), #d96810);
            border-radius: 2px; margin-bottom: 1.75rem;
        }
        .btn-login {
            display: inline-block;
            padding: 0.875rem 2.5rem;
            background: linear-gradient(135deg, var(--blue), var(--blue-light));
            color: #fff; border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: opacity 0.18s, box-shadow 0.18s;
        }
        .btn-login:hover {
            opacity: 0.91;
            box-shadow: 0 6px 20px rgba(27,63,143,0.28);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-logo">
            <img src="{% static 'img/logo.png' %}" alt="FirstCentral Credit Bureau">
        </div>

        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <div class="card-heading">Password Updated!</div>
        <div class="card-sub">
            Your password has been successfully reset. You can now sign in with your new password.
        </div>

        <div class="orange-bar"></div>

        <a href="{% url 'login' %}" class="btn-login">Sign In &rarr;</a>
    </div>
</body>
</html>
